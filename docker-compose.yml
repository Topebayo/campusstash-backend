version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: campusstash_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: campusstash
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: campusstash_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
